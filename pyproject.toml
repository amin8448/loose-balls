[project]
name = "loose-balls"
version = "0.1.0"
description = "Loose Balls: Second to the ball. Which team gets to a loose ball, and why, from broadcast tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Amin Nabavi" }
]
requires-python = ">=3.12"
dependencies = [
    "databallpy",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy>=1.18.1",
]

[project.scripts]
looseball = "looseball.cli:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["looseball", "looseball_research"]

[tool.uv.sources]
databallpy = { git = "https://github.com/Alek050/databallpy", rev = "3f9de8d28531aa12d826ee99aed8de7aeee0897f" }

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "pypdf",
    "pytest",
    "ruff",
    "tabulate>=0.10.0",
]
